whats-new-or-novel:
  # https://confluence.ipac.caltech.edu/pages/viewpage.action?pageId=620833494
  # or guess from dataset yaml. eg, Provides a comprehensive view of the mid-infrared sky
  - This is a full-sky, time-series dataset in four mid-infrared bandpasses generated by second-pass image processing with improved calibrations and reduction algorithms.
  - Extends the WISE All-Sky dataset in three mid-infrared bandpasses through the mission's 3-Band Cryo survey phase.
  - This is a large, uniform, time-series dataset of the full sky in two mid-infrared bandpasses. The images can be mined for forced photometry. The catalog can support statistics and machine learning analysis.
  - Extends the WISE All-Sky dataset in two mid-infrared bandpasses through the mission's Post-Cryo survey phase.
  - This will be the first ever dataset of spectra covering the full sky in the optical to near-infrared range.
how-optimized-for-cloud:
  - examples:
    - Dataset contains the original images and ancillary files produced by the mission. Cloud access will facilitate large-scale compute and analysis.
    - Parquet versions of the catalogs that are formatted and partitioned specifically to facilitate this type of access
    - Catalog is in Parquet format and organized specifically to facilitate cloud access and large-scale compute/analysis
