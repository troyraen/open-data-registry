Name: 'SPHEREx Data Release 1 (DR1): An All-Sky Spectral Survey'
Description: 'The Spectro-Photometer for the History of the Universe, Epoch of Reionization, and Ices Explorer (SPHEREx) is a NASA Astrophysics Medium-class Explorer (MIDEX) mission launched in March 2025. During its planned two-year mission, SPHEREx will perform the first ever all-sky spectral survey in the optical to near-infrared (0.75-5 microns). SPHEREx data will be used to probe inflation and the early universe, trace the history of galactic light production, and investigate the origin of planetary systems and biogenic ices, in addition to contributing to many other astrophysics research topics. SPHEREx Data Release 1 (DR1) contains all Survey 1 and Survey 2 data, reprocessed with the same improved pipeline and calibrations as Quick Release 3 (QR3). It also includes a new product, the All-Sky Cube, which is a set of spectral data cubes covering the whole sky, built from the DR1 Spectral Images. IRSA released DR1 in November 2026. Together, DR1 and QR3 supersede QR2.'
Documentation: https://irsa.ipac.caltech.edu/data/SPHEREx/docs/overview_dr1.html
Contact: https://irsa.ipac.caltech.edu/docs/help_desk.html
ManagedBy: "NASA/IPAC Infrared Science Archive ([IRSA](https://irsa.ipac.caltech.edu)) at Caltech"
UpdateFrequency: The data may be presented in new ways as the products become available.
Tags:
  - aws-pds
  - astronomy
  - imaging
  - object detection
  - satellite imagery
  - survey
License: https://irsa.ipac.caltech.edu/data_use_terms.html
Citation: 'If you use SPHEREx DR1 data from the IRSA archive, please cite the appropriate Digital Object Identifier: [10.26131/IRSA678](https://www.ipac.caltech.edu/doi/irsa/10.26131/IRSA678) for the Spectral Images or [10.26131/IRSA679](https://www.ipac.caltech.edu/doi/irsa/10.26131/IRSA679) for the All-Sky Cube, include the following acknowledgement: "This publication makes use of data products from the Spectro-Photometer for the History of the Universe, Epoch of Reionization and Ices Explorer (SPHEREx), which is a joint project of the Jet Propulsion Laboratory and the California Institute of Technology, and is funded by the National Aeronautics and Space Administration.", and follow the [IRSA acknowledgement guidelines](https://irsa.ipac.caltech.edu/ack.html).'
