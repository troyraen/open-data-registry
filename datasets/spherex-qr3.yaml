Name: 'SPHEREx Quick Release 3 (QR3): An All-Sky Spectral Survey'
Description: 'The Spectro-Photometer for the History of the Universe, Epoch of Reionization, and Ices Explorer (SPHEREx) is a NASA Astrophysics Medium-class Explorer (MIDEX) mission launched in March 2025. During its planned two-year mission, SPHEREx will perform the first ever all-sky spectral survey in the optical to near-infrared (0.75-5 microns). SPHEREx data will be used to probe inflation and the early universe, trace the history of galactic light production, and investigate the origin of planetary systems and biogenic ices, in addition to contributing to many other astrophysics research topics. SPHEREx Quick Release 3 (QR3) contains Survey 3 and Survey 4 data. IRSA began releasing QR3 data on a weekly basis in September 2026. QR3 versions of the data observed from May 16, 2026 to July 19, 2026 are released together with Data Release 1 (DR1). Together, DR1 and QR3 supersede QR2.'
Documentation: https://irsa.ipac.caltech.edu/data/SPHEREx/docs/overview_qr.html
Contact: https://irsa.ipac.caltech.edu/docs/help_desk.html
ManagedBy: "NASA/IPAC Infrared Science Archive ([IRSA](https://irsa.ipac.caltech.edu)) at Caltech"
UpdateFrequency: SPHEREx QR3 is updated weekly. The data may also be presented in new ways as the products become available.
Tags:
  - aws-pds
  - astronomy
  - imaging
  - object detection
  - satellite imagery
  - survey
License: https://irsa.ipac.caltech.edu/data_use_terms.html
Citation: 'If you use SPHEREx QR3 data from the IRSA archive, please cite the Digital Object Identifier [10.26131/IRSA662](https://www.ipac.caltech.edu/doi/irsa/10.26131/IRSA662), include the following acknowledgement: "This publication makes use of data products from the Spectro-Photometer for the History of the Universe, Epoch of Reionization and Ices Explorer (SPHEREx), which is a joint project of the Jet Propulsion Laboratory and the California Institute of Technology, and is funded by the National Aeronautics and Space Administration.", and follow the [IRSA acknowledgement guidelines](https://irsa.ipac.caltech.edu/ack.html).'
