Name: 'Euclid Data Release 1 (DR1)'
Description: 'Euclid launched in July 2023 as a European Space Agency (ESA) mission with involvement by NASA. The primary science goals of Euclid are to better understand the composition and evolution of the dark Universe. The Euclid mission will provide space-based imaging and spectroscopy as well as supporting ground-based imaging to achieve these primary goals. These data will be archived by multiple global repositories, including IRSA, where they will support transformational work in many areas of astrophysics. The first stage of Euclid Data Release 1 (DR1), released in November 2026, includes approximately 1.8 PB of images, catalogs, and spectra from the first year of survey operations. The release covers approximately 1,900 square degrees of the Euclid Wide Survey, as well as observations of the Euclid Deep Fields, calibration fields, and Performance Verification data. Additional DR1 data products for galaxy clustering and weak lensing studies are expected in mid-2027.'
Documentation: https://irsa.ipac.caltech.edu/data/Euclid/docs/overview_dr1.html
Contact: https://irsa.ipac.caltech.edu/docs/help_desk.html
ManagedBy: "NASA/IPAC Infrared Science Archive ([IRSA](https://irsa.ipac.caltech.edu)) at Caltech"
UpdateFrequency: Additional Euclid DR1 data products are expected in mid-2027. The data may also be presented in new ways as the products become available.
Tags:
  - astronomy
  - imaging
  - object detection
  - parquet
  - satellite imagery
  - survey
License: https://irsa.ipac.caltech.edu/data_use_terms.html
Citation: "If you use Euclid DR1, please follow the citation instructions provided at [https://irsa.ipac.caltech.edu/data/Euclid/docs/overview_dr1.html](https://irsa.ipac.caltech.edu/data/Euclid/docs/overview_dr1.html) and [https://irsa.ipac.caltech.edu/ack.html](https://irsa.ipac.caltech.edu/ack.html)."
